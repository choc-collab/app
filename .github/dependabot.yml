version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # eslint v10 breaks eslint-plugin-react@7.x (bundled by eslint-config-next).
      # Stay on 9.x until upstream catches up.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
