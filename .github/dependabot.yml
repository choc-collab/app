version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Roll all minor/patch npm updates into ONE combined PR per run.
      # Major bumps are intentionally left ungrouped so they get their own
      # PR for isolated review (e.g. typescript 6 -> 7 broke peer ranges).
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint v10 breaks eslint-plugin-react@7.x (bundled by eslint-config-next).
      # Stay on 9.x until upstream catches up.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 doesn't expose the compiler API Next.js's build-time
      # typecheck relies on ("does not provide the compiler API required by
      # Next.js"). Stay on 6.x until Next.js supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
